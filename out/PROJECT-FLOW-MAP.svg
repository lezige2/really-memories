<text x="1232" y="494.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >v3 715 行 → 14B QLoRA run2 → adapter</text>
<text x="1232" y="511.55" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" > dev acc 65.3% / test 87.3%; 漏触发 54.5%/20.5%</text>
<text x="1232" y="529.1" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" > 判定 do-not-deploy；sim N/A（cases 无输入）</text>
<rect x="1220" y="562" width="500" height="64" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
