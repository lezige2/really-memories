<text x="1232" y="610.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >仅规格（D10/ARCH-SPEC）；未实现</text>
<text x="1232" y="627.55" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >追问 fail-closed；CPU/SAPI 先行</text>
