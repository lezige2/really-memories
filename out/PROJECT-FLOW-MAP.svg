<text x="1232" y="694.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >20/50/200 recall .769/.824/.711</text>
<text x="1232" y="711.55" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >只写存取保留率；200 是库 token，非 prompt</text>
<rect x="40" y="900" width="1680" height="390" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
<text x="60" y="935.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#202124" text-anchor="start" font-weight='700'>疑点 / 优化点（按优先级）</text>
<text x="60" y="970.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#c62828" text-anchor="start" font-weight='700'>1. 族键不认主体（根因）</text>
<text x="330" y="970.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >当前只按 猫/车牌/手机 合并；12–28 个不同 owner 被并成一族。优化：P0 抽 subject，键改 (subject,predicate)。</text>
<text x="60" y="1013.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#b26a00" text-anchor="start" font-weight='700'>2. 写时无冲突消解</text>
<text x="330" y="1013.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >旧值不标记 superseded，只靠读时猜。优化：P1 同 subject+predicate 写入软覆盖/追问；需用户批准+备份+回滚。</text>
<text x="60" y="1056.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#b26a00" text-anchor="start" font-weight='700'>3. K2 auto 阈值 50 无证据</text>
<text x="330" y="1056.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >50 档没测，51–199 未验证；50 是经验分界不是原理。优化：建 50 块多主体库，四条门槛一起验。</text>
<text x="60" y="1099.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#c62828" text-anchor="start" font-weight='700'>4. recall 0.711 vs pass 0.175</text>
<text x="330" y="1099.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >检索命中高、端到端答对低；归因未做。优化：先做检索→生成→verifier 的逐段归因，不先改模型。</text>
<text x="60" y="1142.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#c62828" text-anchor="start" font-weight='700'>5. 脏数据 / 容量</text>
<text x="330" y="1142.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >norm_hash 未实现；5 对脏数据入库；200 硬拒绝无 LRU。优化：影子 norm_hash 统计收益；容量策略单独产品决策。</text>
<text x="60" y="1185.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#b26a00" text-anchor="start" font-weight='700'>6. 自主性负结果</text>
<text x="330" y="1185.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >run2 跨族不稳、漏触发 54.5%；sim cases 无输入。优化：扩族×30 条、sim 内嵌输入，再谈训练。</text>
<text x="60" y="1228.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#b26a00" text-anchor="start" font-weight='700'>7. 并发隔离事故</text>
<text x="330" y="1228.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" fill="#3c4043" text-anchor="start" >8765 被旧 runner 重连清库。已修：端口/库租约、DB 指纹、停服确认、备份。</text>
</svg>