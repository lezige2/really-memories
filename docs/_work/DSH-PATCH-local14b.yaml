#   config:
#     provider: local14b
#     model: local-14b-memory
#
# 备份：cp ~/.dsh/profiles/desktop/cordis.patch.yml ~/.dsh/profiles/desktop/cordis.patch.yml.bak-20261027-local14b
# 回滚：cp ~/.dsh/profiles/desktop/cordis.patch.yml.bak-20261027-local14b ~/.dsh/profiles/desktop/cordis.patch.yml
# 生效：保存后 HMR 自动热重载（1–2 s）；未出现模型则重启 DSH
